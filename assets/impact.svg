  <text class="n" x="852" y="60" fill="#f472b6">8 h+</text>
  <text class="l" x="852" y="90">of narrated animation</text>
  <text class="s" x="852" y="112">subtitles, quizzes and printable notes</text>
</g>
<g class="t" style="animation-delay:.3s">
  <rect x="2" y="156" width="372" height="126" rx="16" fill="#0b1130" stroke="#34d399" stroke-opacity=".4" stroke-width="1.5"/>
