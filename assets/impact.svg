<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="284" viewBox="0 0 1200 284" role="img" aria-labelledby="it id">
<title id="it">Impact so far</title>
<desc id="id">273 written AI lectures; 110 animated video lectures; more than 8 hours of narrated animation; 4 research projects with 1 paper in the publication process; more than 10 years of competitive programming; 39 certificates and credentials.</desc>
<defs>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".07"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="tiles">
    <rect x="2" y="2" width="372" height="126" rx="16"/><rect x="414" y="2" width="372" height="126" rx="16"/><rect x="826" y="2" width="372" height="126" rx="16"/>
    <rect x="2" y="156" width="372" height="126" rx="16"/><rect x="414" y="156" width="372" height="126" rx="16"/><rect x="826" y="156" width="372" height="126" rx="16"/>
  </clipPath>
</defs>
<style>
  text { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .t { animation: up .8s ease-out both; }
  .n { font-size: 46px; font-weight: 800; }
  .l { font-size: 18px; font-weight: 600; fill: #e0e7ff; }
  .s { font-size: 14px; fill: #94a3d8; }
  .shine { animation: shine 7s ease-in-out infinite; }
  @keyframes up { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @keyframes shine { 0% { transform: translateX(-400px) } 45%, 100% { transform: translateX(1400px) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>

<g class="t">
