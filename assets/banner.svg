<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="bt bd">
<title id="bt">Janin A Apurba</title>
<desc id="bd">AI and computer vision researcher and educator. B.Sc. CSE, AUST. Advanced ICT Officer, CNRS-UNHCR. Seeking a fully funded PhD in AI. Sponsored projects become open for all.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#060a1a"/>
    <stop offset=".55" stop-color="#0d1333"/>
    <stop offset="1" stop-color="#1b0e3d"/>
  </linearGradient>
  <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#67e8f9"/>
    <stop offset=".5" stop-color="#a5b4fc"/>
    <stop offset="1" stop-color="#e879f9"/>
  </linearGradient>
  <radialGradient id="g1" cx=".82" cy=".5" r=".42">
    <stop offset="0" stop-color="#7c3aed" stop-opacity=".38"/>
    <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2" cx=".08" cy=".05" r=".5">
    <stop offset="0" stop-color="#06b6d4" stop-opacity=".22"/>
    <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="sc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
    <stop offset="1" stop-color="#22d3ee" stop-opacity=".28"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#8ea2ff" stroke-opacity=".06"/>
  </pattern>
  <clipPath id="card"><rect width="1200" height="380" rx="22"/></clipPath>
  <clipPath id="vf"><rect x="792" y="62" width="356" height="280"/></clipPath>
</defs>
<style>
  .sans { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'Cascadia Code', Consolas, 'Courier New', monospace; }
  .star { animation: tw 4s ease-in-out infinite; }
  .node { animation: nd 3s ease-in-out infinite; }
  .sig { fill: none; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 16 600; animation: sg 3.2s linear infinite; }
  .scan { animation: scan 4.5s linear infinite; }
  .dot { animation: dot 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .rise { animation: rise .9s ease-out both; }
  @keyframes tw { 0%, 100% { opacity: .15 } 50% { opacity: .9 } }
  @keyframes nd { 0%, 100% { opacity: .25 } 50% { opacity: 1 } }
  @keyframes sg { from { stroke-dashoffset: 616 } to { stroke-dashoffset: 0 } }
  @keyframes scan { from { transform: translateY(0) } to { transform: translateY(262px) } }
  @keyframes dot { 0%, 100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.7); opacity: .45 } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
